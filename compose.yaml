# Services for the TAS workers server. No keys anywhere: public data only.
services:
  okx-copytrading:
    image: python:3.12-slim
    restart: unless-stopped
    command: ["python", "-u", "/app/snapshot.py"]
    volumes:
      - ./okx:/app:ro
      - /srv/tas/data:/data
      - /srv/tas/public:/public
    environment:
      OKX_TOP_N: "200"
      OKX_MAX_PAGES: "60"
      OKX_RUN_HOUR: "1"
      CODE_REV: "2"
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  strategy-lab:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["python", "-u", "/app/lab.py"]
    volumes:
      - ./strategy-lab:/app:ro
      - /srv/tas/data/strategy-lab:/freqtrade/user_data
      - /srv/tas/public:/public
    environment:
      LAB_RUN_HOUR: "2"
      LAB_LOOKAHEAD_PER_DAY: "6"
    mem_limit: 2g
    cpus: 1.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
