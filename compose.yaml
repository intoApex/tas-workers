# Services for the TAS workers server. No keys anywhere: public data only.
services:
  okx-copytrading:
    image: python:3.12-slim
    restart: unless-stopped
    command: ["python", "-u", "/app/snapshot.py"]
    volumes:
      - ./okx:/app:ro
      - /srv/tas/data:/data
      - /srv/tas/public:/public
    environment:
      OKX_TOP_N: "200"
      OKX_MAX_PAGES: "60"
      OKX_RUN_HOUR: "0"
      CODE_REV: "2"
    mem_limit: 256m
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  strategy-lab:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["python", "-u", "/app/lab.py"]
    volumes:
      - ./strategy-lab:/app:ro
      - /srv/tas/data/strategy-lab:/freqtrade/user_data
      - /srv/tas/public/strategy-lab:/public/strategy-lab  # only its own results folder: it runs community code
    environment:
      # 05:00 UTC since 2026-11-11 (was 22:00). The site fetches results once a day, in practice between 07:10 and 08:25 UTC
      # (GitHub starts the 01:17 schedule that late). A 22:00 run was stamped with yesterday's date by the time the site showed
      # it, so the board always read one day behind and a bot that joined showed "starts <yesterday>" for a day and a half.
      # A 05:00 run takes about an hour, is stamped with today's date, and is two to three hours old when it goes up.
      LAB_RUN_HOUR: "5"
      PYTHONUSERBASE: /home/ftuser/.local
      LAB_LOOKAHEAD_PER_DAY: "12"
      LAB_CODE_REV: "10"  # bump to run at once with new code. Since 2026-11-12 the lab loads new code by itself between runs; the bump is only for "run now"
    mem_limit: 2g
    cpus: 1.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

  # The leverage board: the same runner in futures mode (Binance USDT perpetuals, isolated margin, shorting allowed),
  # with its own data, registry and results. Never ranked together with the spot lab.
  strategy-lab-futures:
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["python", "-u", "/app/lab.py"]
    volumes:
      - ./strategy-lab:/app:ro
      - /srv/tas/data/strategy-lab-futures:/freqtrade/user_data
      - /srv/tas/public/strategy-lab-futures:/public/strategy-lab-futures
    environment:
      LAB_MODE: futures
      LAB_RUN_HOUR: "4"  # 04:00 UTC since 2026-11-11 (was 21:00): an hour before the spot lab, same day's date as the site's fetch
      PYTHONUSERBASE: /home/ftuser/.local
      LAB_LOOKAHEAD_PER_DAY: "6"
      LAB_CODE_REV: "2"  # bump to run at once with new code (new code alone is loaded by the lab itself between runs)
    mem_limit: 1500m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}

  # The runner's signal hub (runner/hub.py, 2026-11-14): live paper copies of the Strategy Lab bots in runner/strategies.json,
  # every fill published at /runner/signals.json. Paper money, no keys. OFF until the "runner" profile is enabled
  # (COMPOSE_PROFILES=runner): each copy needs about 250 MB and the two labs already use up to 3.5 GB of this 4 GB server
  # between 04:00 and 06:00 UTC. Resize the server first. See runner/DESIGN.md.
  runner-signals:
    profiles: ["runner"]
    image: freqtradeorg/freqtrade:stable
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["python", "-u", "/app/hub.py"]
    volumes:
      - ./runner:/app:ro
      - ./strategy-lab:/labcfg:ro                               # the lab's config.json and market-orders.json
      - /srv/tas/data/strategy-lab:/lab:ro                       # the lab's frozen strategy files and registry
      - /srv/tas/public/strategy-lab:/labpub:ro                  # the lab's results.json (which bots run today)
      - /srv/tas/data/runner:/freqtrade/user_data
      - /srv/tas/public/runner:/public/runner
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
